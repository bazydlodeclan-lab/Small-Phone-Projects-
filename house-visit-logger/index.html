<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>House Visit Logger</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>House Visit Logger</h1>
    <button id="settingsBtn" class="icon-btn" type="button" title="Settings">⚙️</button>
  </header>

  <main>
    <section id="newVisitSection">
      <button id="captureBtn" class="camera-btn" type="button">📷<br>Take Photo</button>
      <input type="file" id="fileInput" accept="image/*" capture="environment" hidden>
    </section>

    <section id="detailsSection" hidden>
      <img id="thumb" class="thumb-preview" alt="House photo">
      <p id="status" class="status"></p>

      <label for="addressField">Address</label>
      <input type="text" id="addressField" placeholder="123 Main St">

      <div class="outcome-group">
        <button class="outcome-btn" type="button" data-outcome="not_home">Not Home</button>
        <button class="outcome-btn" type="button" data-outcome="said_no">Said No</button>
        <button class="outcome-btn" type="button" data-outcome="did_it">Did It</button>
      </div>

      <label for="amountField">Amount paid ($)</label>
      <input type="number" id="amountField" placeholder="0.00" step="0.01" min="0" inputmode="decimal">

      <div class="action-row">
        <button id="retakeBtn" class="secondary-btn" type="button">Retake</button>
        <button id="saveBtn" class="primary-btn" type="button">Save</button>
      </div>
    </section>
  </main>

  <a href="history.html" class="history-link">View Log →</a>

  <script src="db.js"></script>
  <script src="log.js"></script>
</body>
</html>
