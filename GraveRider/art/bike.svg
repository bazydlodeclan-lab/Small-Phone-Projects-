<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 110" width="660" height="330">
  <!-- Grave Rider dirt bike, side view facing right. 1 unit = 1 cm.
       Chassis centre (physics origin) is at (110, 75). Wheels, fork legs and
       swingarm are drawn separately by the game because they move. -->
  <defs>
    <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9a4a"/><stop offset="0.55" stop-color="#e8742a"/><stop offset="1" stop-color="#a8460f"/>
    </linearGradient>
    <linearGradient id="white" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#c9c9cf"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d7d7dd"/><stop offset="0.5" stop-color="#8b8b93"/><stop offset="1" stop-color="#4a4a52"/>
    </linearGradient>
    <linearGradient id="engine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5c5c63"/><stop offset="1" stop-color="#25252a"/>
    </linearGradient>
    <linearGradient id="seat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a3f"/><stop offset="1" stop-color="#101012"/>
    </linearGradient>
    <linearGradient id="pipe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9e3d6"/><stop offset="0.5" stop-color="#a39b8c"/><stop offset="1" stop-color="#5e574c"/>
    </linearGradient>
  </defs>

  <!-- Silencer (under the rear fender) -->
  <g transform="rotate(-8 50 47)">
    <rect x="22" y="42" width="46" height="11" rx="5" fill="url(#metal)" stroke="#2a2a2e" stroke-width="0.8"/>
    <rect x="20" y="43.5" width="5" height="8" rx="2" fill="#1c1c20"/>
    <rect x="40" y="42" width="3" height="11" fill="#33333a"/>
  </g>

  <!-- Frame tubes -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M160 27 L132 60 L120 88" stroke="#1d1d22" stroke-width="6"/>
    <path d="M160 27 L132 60 L120 88" stroke="#5a5a64" stroke-width="2.2"/>
    <path d="M158 30 L104 48 L98 78" stroke="#1d1d22" stroke-width="5"/>
    <path d="M158 30 L104 48 L98 78" stroke="#5a5a64" stroke-width="1.8"/>
    <path d="M104 48 L62 44" stroke="#1d1d22" stroke-width="3.5"/>
  </g>

  <!-- Rear shock spring -->
  <g transform="rotate(25 96 62)">
    <rect x="93" y="46" width="6" height="30" rx="2" fill="#2a2a2e"/>
    <path d="M90 50 h12 M90 54 h12 M90 58 h12 M90 62 h12 M90 66 h12 M90 70 h12" stroke="#e8c31f" stroke-width="2.2"/>
  </g>

  <!-- Engine -->
  <path d="M98 64 L132 62 Q140 63 140 72 L138 88 Q136 94 128 94 L104 94 Q96 93 96 86 Z" fill="url(#engine)" stroke="#141416" stroke-width="1"/>
  <g transform="rotate(-18 128 56)">
    <rect x="118" y="44" width="20" height="22" rx="2" fill="url(#engine)" stroke="#141416" stroke-width="1"/>
    <path d="M118 48 h20 M118 52 h20 M118 56 h20 M118 60 h20" stroke="#77777f" stroke-width="1.1"/>
  </g>
  <circle cx="110" cy="80" r="10" fill="#3d3d44" stroke="#18181b" stroke-width="1.2"/>
  <circle cx="110" cy="80" r="6" fill="#55555d"/>
  <circle cx="110" cy="80" r="2" fill="#222"/>
  <circle cx="98" cy="82" r="3.5" fill="#1a1a1a" stroke="#666" stroke-width="0.8"/>

  <!-- Exhaust header pipe -->
  <path d="M138 58 Q152 62 146 76 Q138 92 116 90 Q98 88 86 72 L66 52" fill="none" stroke="#3b362e" stroke-width="6" stroke-linecap="round"/>
  <path d="M138 58 Q152 62 146 76 Q138 92 116 90 Q98 88 86 72 L66 52" fill="none" stroke="url(#pipe)" stroke-width="4" stroke-linecap="round"/>

  <!-- Rear fender + side number plate -->
  <path d="M96 42 L34 38 Q16 37 6 31 L7 37 Q24 47 60 50 L96 53 Z" fill="url(#orange)" stroke="#6d2c06" stroke-width="0.8"/>
  <path d="M68 44 L102 45 L104 68 Q90 72 80 72 Q68 60 68 44 Z" fill="url(#white)" stroke="#8a8a90" stroke-width="0.8"/>
  <text x="86" y="63" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="15" text-anchor="middle" fill="#1a1a1a">13</text>

  <!-- Seat -->
  <path d="M58 38 Q60 32 70 32 L128 28 Q137 28 139 33 L135 38 L62 42 Z" fill="url(#seat)"/>
  <path d="M66 33.5 L128 29.5" stroke="#5a5a62" stroke-width="1" stroke-linecap="round"/>

  <!-- Fuel tank / radiator shroud -->
  <path d="M124 31 L150 23 Q159 22 161 29 L157 52 Q150 64 132 67 L122 52 Z" fill="url(#orange)" stroke="#6d2c06" stroke-width="0.9"/>
  <path d="M128 50 Q140 48 154 36 L156 44 Q146 58 132 61 Z" fill="#1a1a1a"/>
  <path d="M131 55 Q142 53 152 45" stroke="#5b2a86" stroke-width="2.5" fill="none"/>
  <!-- Radiator grille -->
  <g stroke="#2a2a2e" stroke-width="0.9">
    <path d="M140 31 L152 28 M140 35 L152 32 M140 39 L151 36 M141 43 L150 40"/>
  </g>

  <!-- Front number plate -->
  <path d="M163 21 L177 25 L173 47 L159 43 Z" fill="url(#white)" stroke="#8a8a90" stroke-width="0.8"/>
  <!-- Front fender (mounted high, on the fork clamp) -->
  <path d="M158 51 Q186 43 214 52 L212 57 Q186 50 160 57 Z" fill="url(#orange)" stroke="#6d2c06" stroke-width="0.8"/>

  <!-- Fork clamps + handlebar -->
  <rect x="155" y="21" width="12" height="5" rx="1.5" fill="#c9c9d1" stroke="#555" stroke-width="0.6" transform="rotate(18 161 23)"/>
  <path d="M162 22 L156 12" stroke="#151515" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M159 18 L149 14" stroke="#9a9aa2" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Footpeg -->
  <rect x="100" y="85" width="12" height="4" rx="1" fill="#2a2a2e" stroke="#777" stroke-width="0.6"/>
</svg>
