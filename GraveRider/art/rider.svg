<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 75 147" width="225" height="441">
  <!-- Motocross rider, side view facing right, arms left off (the game draws
       them reaching to the handlebar). 1 unit = 1 cm.
       The footpeg (physics pivot) is at (45, 142). Shoulder at (45, 40). -->
  <defs>
    <linearGradient id="pants" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b2554"/><stop offset="1" stop-color="#1c1029"/>
    </linearGradient>
    <linearGradient id="jersey" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#151515"/><stop offset="0.6" stop-color="#2c2c30"/><stop offset="1" stop-color="#151515"/>
    </linearGradient>
    <linearGradient id="helmet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#bdbdc4"/>
    </linearGradient>
    <linearGradient id="boot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f4f6"/><stop offset="1" stop-color="#a9a9b0"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb347"/><stop offset="1" stop-color="#d1500f"/>
    </linearGradient>
  </defs>

  <!-- Thigh (hip to knee) -->
  <path d="M10 74 Q30 80 58 92 Q64 97 60 105 Q52 108 44 104 L14 90 Q4 84 10 74 Z" fill="url(#pants)"/>
  <path d="M22 84 Q36 89 50 96" stroke="#e8742a" stroke-width="2.4" fill="none" stroke-linecap="round"/>

  <!-- Shin + knee guard (knee to ankle) -->
  <path d="M50 96 Q62 96 62 106 L50 132 L38 128 Z" fill="url(#pants)"/>
  <path d="M52 95 Q64 97 62 108 L56 112 Q50 104 52 95 Z" fill="#2a2a2e"/>

  <!-- Boot standing on the footpeg -->
  <path d="M38 112 L54 116 L52 134 L60 138 Q63 142 58 144 L34 144 Q30 143 31 139 L33 132 Z" fill="url(#boot)" stroke="#6b6b72" stroke-width="0.7"/>
  <path d="M35 120 L53 124 M34 127 L52 130" stroke="#e8742a" stroke-width="2"/>
  <rect x="31" y="142" width="29" height="3" rx="1.2" fill="#1a1a1a"/>

  <!-- Torso (jersey) with chest protector, leaning forward -->
  <path d="M8 76 Q4 62 14 50 Q24 38 38 34 Q50 32 54 40 Q56 52 46 64 Q36 76 28 82 Q16 84 8 76 Z" fill="url(#jersey)"/>
  <path d="M40 38 Q52 36 54 44 Q52 56 44 64 Q40 56 40 38 Z" fill="#3c3c42"/>
  <path d="M14 60 Q26 50 42 44" stroke="#e8742a" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M12 68 Q24 60 38 54" stroke="#5b2a86" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <text x="22" y="56" font-family="Arial Black, Arial, sans-serif" font-size="9" font-weight="900" fill="#f2f2f2" transform="rotate(-28 22 56)">13</text>

  <!-- Neck brace -->
  <path d="M38 32 Q48 26 58 30 L58 36 Q48 32 40 38 Z" fill="#2a2a2e"/>

  <!-- Helmet: shell, peak, chin bar, goggles -->
  <path d="M40 22 Q40 6 54 5 Q67 5 68 18 L70 28 Q62 33 50 33 Q42 32 40 22 Z" fill="url(#helmet)" stroke="#8a8a90" stroke-width="0.8"/>
  <path d="M46 6 Q62 0 74 8 L73 11 Q60 6 48 10 Z" fill="#e8742a" stroke="#6d2c06" stroke-width="0.6"/>
  <path d="M62 24 Q72 24 73 30 Q68 34 60 32 Z" fill="#e8742a" stroke="#6d2c06" stroke-width="0.6"/>
  <path d="M42 15 Q55 12 67 14" stroke="#e8742a" stroke-width="2.4" fill="none"/>
  <path d="M40 18 L58 17" stroke="#1a1a1a" stroke-width="3" />
  <rect x="57" y="13.5" width="11" height="7.5" rx="3" fill="url(#lens)" stroke="#1a1a1a" stroke-width="1.4"/>
</svg>
