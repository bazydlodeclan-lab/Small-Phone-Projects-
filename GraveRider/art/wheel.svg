<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="300" height="300">
  <!-- Knobby dirt bike wheel. Centre of the picture = axle. -->
  <defs>
    <radialGradient id="tyre" cx="50%" cy="50%" r="50%">
      <stop offset="0.78" stop-color="#2a2a2c"/><stop offset="1" stop-color="#0d0d0e"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2f2f5"/><stop offset="0.5" stop-color="#9c9ca4"/><stop offset="1" stop-color="#4a4a52"/>
    </linearGradient>
  </defs>
  <!-- Knobs around the tyre -->
  <g fill="#141415"><rect x="46.5" y="0" width="7" height="6" rx="1"/></g>
  <g fill="#141415">
    <rect x="46.5" y="0" width="7" height="6" rx="1" transform="rotate(15 50 50)"/>
    <rect x="46.5" y="0" width="7" height="6" rx="1" transform="rotate(30 50 50)"/>
    <rect x="46.5" y="0" width="7" height="6" rx="1" transform="rotate(45 50 50)"/>
    <rect x="46.5" y="0" width="7" height="6" rx="1" transform="rotate(60 50 50)"/>
    <rect x="46.5" y="0" width="7" height="6" rx="1" transform="rotate(75 50 50)"/>
    <rect x="46.5" y="0" width="7" height="6" rx="1" transform="rotate(90 50 50)"/>
    <rect x="46.5" y="0" width="7" height="6" rx="1" transform="rotate(105 50 50)"/>
    <rect x="46.5" y="0" width="7" height="6" rx="1" transform="rotate(120 50 50)"/>
    <rect x="46.5" y="0" width="7" height="6" rx="1" transform="rotate(135 50 50)"/>
    <rect x="46.5" y="0" width="7" height="6" rx="1" transform="rotate(150 50 50)"/>
    <rect x="46.5" y="0" width="7" height="6" rx="1" transform="rotate(165 50 50)"/>
    <rect x="46.5" y="0" width="7" height="6" rx="1" transform="rotate(180 50 50)"/>
    <rect x="46.5" y="0" width="7" height="6" rx="1" transform="rotate(195 50 50)"/>
    <rect x="46.5" y="0" width="7" height="6" rx="1" transform="rotate(210 50 50)"/>
    <rect x="46.5" y="0" width="7" height="6" rx="1" transform="rotate(225 50 50)"/>
    <rect x="46.5" y="0" width="7" height="6" rx="1" transform="rotate(240 50 50)"/>
    <rect x="46.5" y="0" width="7" height="6" rx="1" transform="rotate(255 50 50)"/>
    <rect x="46.5" y="0" width="7" height="6" rx="1" transform="rotate(270 50 50)"/>
    <rect x="46.5" y="0" width="7" height="6" rx="1" transform="rotate(285 50 50)"/>
    <rect x="46.5" y="0" width="7" height="6" rx="1" transform="rotate(300 50 50)"/>
    <rect x="46.5" y="0" width="7" height="6" rx="1" transform="rotate(315 50 50)"/>
    <rect x="46.5" y="0" width="7" height="6" rx="1" transform="rotate(330 50 50)"/>
    <rect x="46.5" y="0" width="7" height="6" rx="1" transform="rotate(345 50 50)"/>
  </g>
  <!-- Tyre -->
  <circle cx="50" cy="50" r="46" fill="url(#tyre)"/>
  <circle cx="50" cy="50" r="37" fill="#1a1a1c"/>
  <!-- Rim -->
  <circle cx="50" cy="50" r="36" fill="none" stroke="url(#rim)" stroke-width="3.5"/>
  <!-- Spokes -->
  <g stroke="#b8b8c0" stroke-width="0.7">
    <path d="M50 44 L50 14 M50 56 L50 86 M44 50 L14 50 M56 50 L86 50"/>
    <path d="M54.2 45.8 L75.5 24.5 M45.8 54.2 L24.5 75.5 M45.8 45.8 L24.5 24.5 M54.2 54.2 L75.5 75.5"/>
    <path d="M52.3 44.5 L63.8 16.7 M47.7 55.5 L36.2 83.3 M44.5 47.7 L16.7 36.2 M55.5 52.3 L83.3 63.8"/>
    <path d="M55.5 47.7 L83.3 36.2 M44.5 52.3 L16.7 63.8 M47.7 44.5 L36.2 16.7 M52.3 55.5 L63.8 83.3"/>
  </g>
  <!-- Brake disc + hub -->
  <circle cx="50" cy="50" r="15" fill="none" stroke="#8d8d95" stroke-width="5"/>
  <g fill="#3a3a40">
    <circle cx="50" cy="37" r="1.3"/><circle cx="63" cy="50" r="1.3"/><circle cx="50" cy="63" r="1.3"/><circle cx="37" cy="50" r="1.3"/>
    <circle cx="59.2" cy="40.8" r="1.3"/><circle cx="59.2" cy="59.2" r="1.3"/><circle cx="40.8" cy="59.2" r="1.3"/><circle cx="40.8" cy="40.8" r="1.3"/>
  </g>
  <circle cx="50" cy="50" r="7" fill="url(#rim)" stroke="#333" stroke-width="0.8"/>
  <circle cx="50" cy="50" r="2.5" fill="#e8742a"/>
</svg>
