<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grave Rider</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #07051a; }
    canvas { display: block; }
    /* Tuning panel (press T) */
    #tuning {
      display: none; position: absolute; top: 12px; right: 12px; width: 280px;
      padding: 14px; background: rgba(15, 10, 35, 0.92); color: #eee;
      font: 14px sans-serif; border: 2px solid #ff8a1f; border-radius: 10px;
      max-height: calc(100vh - 24px); overflow-y: auto; box-sizing: border-box;
    }
    #tuning.open { display: block; }
    #tuning h2 { margin: 0 0 10px; font-size: 16px; color: #ff8a1f; }
    #tuning .row { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; margin-bottom: 10px; }
    #tuning .row input { grid-column: 1 / 3; width: 100%; accent-color: #ff8a1f; }
    #tuning button {
      background: #ff8a1f; color: #111; border: 0; border-radius: 6px;
      padding: 7px 12px; font-weight: bold; cursor: pointer; margin: 0 6px 6px 0;
    }
    #tuning-text { display: none; width: 100%; height: 120px; margin-top: 10px; box-sizing: border-box; font: 12px monospace; }
    #tuning-status { margin-top: 8px; min-height: 18px; color: #7dff9a; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="tuning">
    <h2>Tuning (press T to close)</h2>
    <div id="tuning-rows"></div>
    <button id="tuning-copy">Copy settings</button>
    <button id="tuning-reset">Reset</button>
    <button id="tuning-clear">Clear best times</button>
    <div id="tuning-status"></div>
    <textarea id="tuning-text" readonly></textarea>
  </div>

  <!-- Order matters: physics library first, the game last -->
  <!-- If the game cannot start, show why on the screen instead of a blank page -->
  <script>
    (function () {
      function show(msg) {
        var d = document.getElementById("startError");
        if (!d) {
          d = document.createElement("div"); d.id = "startError";
          d.style.cssText = "position:fixed;left:0;right:0;top:0;padding:14px;background:#b00020;color:#fff;font:16px sans-serif;z-index:99;white-space:pre-wrap";
          document.body.appendChild(d);
        }
        d.textContent += msg + "\n";
      }
      window.addEventListener("error", function (e) {
        if (e.target && e.target.src) show("A game file did not load: " + e.target.src + "\nUnzip the whole folder and open index.html inside it.");
        else show("Game error: " + e.message + (e.filename ? " (" + e.filename.split("/").pop() + ":" + e.lineno + ")" : ""));
      }, true);
    })();
  </script>
  <script src="lib/planck.min.js?v=20261016"></script>
  <script src="js/config.js?v=20261016"></script>
  <script src="js/levels.js?v=20261016"></script>
  <script src="js/bike.js?v=20261016"></script>
  <script src="js/themes.js?v=20261016"></script>
  <script src="js/game.js?v=20261016"></script>
</body>
</html>
