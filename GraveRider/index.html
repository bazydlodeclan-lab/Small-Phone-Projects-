<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grave Rider</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #07051a; }
    canvas { display: block; }
    /* Tuning panel (press T) */
    #tuning {
      display: none; position: absolute; top: 12px; right: 12px; width: 280px;
      padding: 14px; background: rgba(15, 10, 35, 0.92); color: #eee;
      font: 14px sans-serif; border: 2px solid #ff8a1f; border-radius: 10px;
    }
    #tuning.open { display: block; }
    #tuning h2 { margin: 0 0 10px; font-size: 16px; color: #ff8a1f; }
    #tuning .row { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; margin-bottom: 10px; }
    #tuning .row input { grid-column: 1 / 3; width: 100%; accent-color: #ff8a1f; }
    #tuning button {
      background: #ff8a1f; color: #111; border: 0; border-radius: 6px;
      padding: 7px 12px; font-weight: bold; cursor: pointer; margin: 0 6px 6px 0;
    }
    #tuning-text { display: none; width: 100%; height: 120px; margin-top: 10px; box-sizing: border-box; font: 12px monospace; }
    #tuning-status { margin-top: 8px; min-height: 18px; color: #7dff9a; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="tuning">
    <h2>Tuning (press T to close)</h2>
    <div id="tuning-rows"></div>
    <button id="tuning-copy">Copy settings</button>
    <button id="tuning-reset">Reset</button>
    <button id="tuning-clear">Clear best times</button>
    <div id="tuning-status"></div>
    <textarea id="tuning-text" readonly></textarea>
  </div>

  <!-- Order matters: physics library first, the game last -->
  <script src="lib/planck.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/levels.js"></script>
  <script src="js/bike.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
